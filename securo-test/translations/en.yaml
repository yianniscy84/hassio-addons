configuration:
  secret_key:
    name: Secret Key
    description: Secret key for session signing. Leave empty to auto-generate.
  frontend_url:
    name: Frontend URL
    description: Public URL where Securo is accessible (e.g. https://securo.example.com). Used for OAuth callbacks and CORS.
  debug:
    name: Debug Mode
    description: Enable debug logging.
  db_password:
    name: Database Password
    description: PostgreSQL password.
  pluggy_client_id:
    name: Pluggy Client ID
    description: Client ID for Pluggy bank sync (Brazilian banks).
  pluggy_client_secret:
    name: Pluggy Client Secret
    description: Client secret for Pluggy bank sync.
  enable_banking_app_id:
    name: Enable Banking App ID
    description: Application ID for Enable Banking (European banks).
  enable_banking_history_days:
    name: Enable Banking History Days
    description: Number of days of transaction history to fetch on initial sync (default 999).
  simplefin_enabled:
    name: SimpleFIN Enabled
    description: Enable SimpleFIN bank sync (US and international).
  oidc_enabled:
    name: OIDC Enabled
    description: Enable OIDC single sign-on.
  oidc_provider_name:
    name: OIDC Provider Name
    description: Display name for the OIDC provider.
  oidc_discovery_url:
    name: OIDC Discovery URL
    description: OpenID Connect discovery URL.
  oidc_client_id:
    name: OIDC Client ID
    description: OIDC client ID.
  oidc_client_secret:
    name: OIDC Client Secret
    description: OIDC client secret.
  local_auth_enabled:
    name: Local Authentication
    description: Allow password-based login (disable for OIDC-only mode).
  openexchangerates_app_id:
    name: Open Exchange Rates App ID
    description: API key for automatic currency conversion.
  tesouro_direto_enabled:
    name: Tesouro Direto
    description: Enable Brazilian Treasury bond lookup.
  agents_enabled:
    name: AI Agents and MCP
    description: Enable Securo AI agents and the built-in MCP server (JSON-RPC on port 8765 and /mcp). Off by default.
  agents_mcp_jwt_secret:
    name: MCP JWT Secret
    description: Shared secret for MCP tokens. Leave empty to auto-generate and persist under /data.
  agents_external_mcp_url:
    name: External MCP URL
    description: Public MCP URL shown in the UI (e.g. http://homeassistant.local:8765/mcp). If empty, derived from Frontend URL as {frontend_url}/mcp.
  agents_extra_mcp_servers:
    name: Extra MCP Servers
    description: Comma-separated extra MCP servers as URL[|name], e.g. http://tools:9000/mcp|my-tools
  agents_default_provider:
    name: Default LLM Provider
    description: Default in-app agent provider (openai, anthropic, ollama, openai_compatible). Optional.
  agents_default_model:
    name: Default LLM Model
    description: Default model name for in-app agents. Optional.
  agents_openai_api_key:
    name: OpenAI API Key
    description: API key for OpenAI (in-app agents and optional embeddings).
  agents_anthropic_api_key:
    name: Anthropic API Key
    description: API key for Anthropic (in-app agents).
  agents_ollama_base_url:
    name: Ollama Base URL
    description: Ollama URL reachable from the addon (e.g. http://host.docker.internal:11434).
  agents_openai_compat_base_url:
    name: OpenAI-compatible Base URL
    description: Base URL for an OpenAI-compatible API (LM Studio, vLLM, etc.).
  agents_openai_compat_api_key:
    name: OpenAI-compatible API Key
    description: API key for the OpenAI-compatible endpoint, if required.
  agents_embedding_provider:
    name: Embedding Provider
    description: Knowledge-base embeddings. Use ollama, openai, or openai_compatible — native (fastembed) is unavailable on Alpine.
