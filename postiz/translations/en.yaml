configuration:
  main_url:
    name: Public / Application URL
    description: >-
      Canonical external URL of your Postiz instance (e.g.
      https://postiz.example.com or http://homeassistant.local:5000). Essential for
      OAuth callbacks (Twitter/X, LinkedIn, Meta, YouTube, etc.) and asset URLs.
      Leave empty to default to http://localhost:5000.
  db_url:
    name: External PostgreSQL Database URL
    description: >-
      PostgreSQL connection string for an external server, e.g.
      postgresql://user:password@host:5432/postiz — leave empty to use the
      bundled PostgreSQL database stored in /data/postgres.
  redis_url:
    name: External Redis URL
    description: >-
      Redis connection URL for an external server, e.g. redis://host:6379 —
      leave empty to use the bundled in-container Redis server.
  disable_registration:
    name: Disable Registration
    description: >-
      Block new user registrations. Recommended to enable after creating your
      initial administrator account.
  openai_api_key:
    name: OpenAI API Key
    description: >-
      Optional OpenAI API key for AI post generation and rewriting capabilities.
  storage_provider:
    name: Storage Provider
    description: >-
      Storage backend for post media and avatars. Choose "local" (stored in
      /data/uploads) or "cloudflare" (Cloudflare R2 / S3 compatible).
  cloudflare_account_id:
    name: Cloudflare Account ID
    description: Optional Cloudflare Account ID for R2 storage.
  cloudflare_access_key:
    name: Cloudflare Access Key ID
    description: Optional Cloudflare R2 Access Key ID.
  cloudflare_secret_access_key:
    name: Cloudflare Secret Access Key
    description: Optional Cloudflare R2 Secret Access Key.
  cloudflare_bucketname:
    name: Cloudflare Bucket Name
    description: Optional Cloudflare R2 Bucket Name.
  cloudflare_bucket_url:
    name: Cloudflare Public Bucket URL
    description: >-
      Public URL endpoint for the Cloudflare R2 bucket (e.g.
      https://pub-xxxx.r2.dev or https://media.yourdomain.com).
  x_api_key:
    name: X (Twitter) API Key
    description: >-
      API Key from an X developer app. Set the app type to "Native App" and
      register https://<your-domain>/integrations/social/x as the callback.
  x_api_secret:
    name: X (Twitter) API Key Secret
    description: API Key Secret for the same X developer app.
  linkedin_client_id:
    name: LinkedIn Client ID
    description: >-
      Client ID from a LinkedIn app with "Share on LinkedIn", "Sign In with
      LinkedIn using OpenID Connect" and "Advertising API" products.
  linkedin_client_secret:
    name: LinkedIn Client Secret
    description: Client Secret for the same LinkedIn app.
  facebook_app_id:
    name: Facebook App ID
    description: >-
      App ID from a Meta app with Facebook Login and Instagram Graph API.
      Callback https://<your-domain>/integrations/social/facebook
  facebook_app_secret:
    name: Facebook App Secret
    description: App Secret for the same Meta app.
  instagram_app_id:
    name: Instagram Standalone App ID
    description: >-
      App ID from an Instagram developer app ("Instagram API with Instagram
      Login"). Callback https://<your-domain>/integrations/social/instagram-standalone
  instagram_app_secret:
    name: Instagram Standalone App Secret
    description: App Secret for the same Instagram app.
  threads_app_id:
    name: Threads App ID
    description: >-
      App ID from a Threads developer app. Callback
      https://<your-domain>/integrations/social/threads
  threads_app_secret:
    name: Threads App Secret
    description: App Secret for the same Threads app.
  youtube_client_id:
    name: YouTube Client ID
    description: >-
      OAuth 2.0 Client ID from Google Cloud Console with the YouTube Data API
      enabled. Callback https://<your-domain>/integrations/social/youtube
  youtube_client_secret:
    name: YouTube Client Secret
    description: OAuth 2.0 Client Secret for the same Google Cloud project.
  tiktok_client_id:
    name: TikTok Client ID
    description: >-
      Client Key from a TikTok developer app. Callback
      https://<your-domain>/integrations/social/tiktok
  tiktok_client_secret:
    name: TikTok Client Secret
    description: Client Secret for the same TikTok app.
  pinterest_client_id:
    name: Pinterest Client ID
    description: >-
      App ID from a Pinterest developer app. Callback
      https://<your-domain>/integrations/social/pinterest
  pinterest_client_secret:
    name: Pinterest Client Secret
    description: App Secret for the same Pinterest app.
  reddit_client_id:
    name: Reddit Client ID
    description: >-
      App ID from a Reddit "web app". Callback
      https://<your-domain>/integrations/social/reddit
  reddit_client_secret:
    name: Reddit Client Secret
    description: App secret for the same Reddit app.
  discord_client_id:
    name: Discord Client ID
    description: >-
      Application ID from the Discord developer portal (Bot + OAuth2 enabled).
      Callback https://<your-domain>/integrations/social/discord
  discord_client_secret:
    name: Discord Client Secret
    description: OAuth2 Client Secret for the same Discord application.
  discord_bot_token:
    name: Discord Bot Token
    description: >-
      Bot token for the same Discord application. Required to list guild
      channels and publish messages.
  mastodon_url:
    name: Mastodon Instance URL
    description: >-
      Base URL of your Mastodon instance (default https://mastodon.social).
      Only needed for self-registered Mastodon apps.
  mastodon_client_id:
    name: Mastodon Client ID
    description: Client key of a Mastodon app registered on your instance.
  mastodon_client_secret:
    name: Mastodon Client Secret
    description: Client secret of the same Mastodon app.
  github_client_id:
    name: GitHub Client ID
    description: >-
      OAuth App Client ID for "Sign in with GitHub". Use the callback URL that
      Postiz shows on the login screen.
  github_client_secret:
    name: GitHub Client Secret
    description: Client Secret for the same GitHub OAuth app.

