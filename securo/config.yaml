name: "Securo"
description: >-
  Self-hosted personal finance manager. Multi-account tracking,
  transaction imports, bank sync, budgets, goals, reports, and optional MCP
version: "0.31.1"
slug: "securo"
init: false
arch:
  - amd64
  - aarch64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ports:
  80/tcp: 8080
  8765/tcp: 8765
ports_description:
  80/tcp: "Securo web interface (also /mcp when agents are enabled)"
  8765/tcp: "Securo MCP (JSON-RPC; JWT required)"
host_network: false
map:
  - type: share
    read_only: false
apparmor: true
webui: "http://[HOST]:[PORT:80]/"
ingress: true
ingress_port: 80
ingress_entry: /
panel_icon: mdi:wallet
panel_title: "Securo"
backup: hot
stage: stable

options:
  secret_key: ""
  frontend_url: ""
  debug: false
  db_password: "postgres"
  pluggy_client_id: ""
  pluggy_client_secret: ""
  enable_banking_app_id: ""
  enable_banking_private_key_file: ""
  enable_banking_oauth_redirect_uri: ""
  enable_banking_history_days: 999
  simplefin_enabled: false
  simplefin_api_url: "https://beta-bridge.simplefin.org"
  oidc_enabled: false
  oidc_provider_name: "OIDC"
  oidc_discovery_url: ""
  oidc_client_id: ""
  oidc_client_secret: ""
  oidc_redirect_uri: ""
  oidc_scopes: "openid email profile"
  oidc_auto_register: true
  oidc_existing_user_link_mode: "disabled"
  oidc_require_verified_email: true
  oidc_sync_roles: false
  oidc_roles_claim: "groups"
  oidc_admin_roles: ""
  oidc_workspace_role_map: ""
  local_auth_enabled: true
  openexchangerates_app_id: ""
  fx_sync_mode: "on_demand"
  tesouro_direto_enabled: true
  agents_enabled: false
  agents_mcp_jwt_secret: ""
  agents_external_mcp_url: ""
  agents_extra_mcp_servers: ""
  agents_default_provider: ""
  agents_default_model: ""
  agents_openai_api_key: ""
  agents_anthropic_api_key: ""
  agents_ollama_base_url: ""
  agents_openai_compat_base_url: ""
  agents_openai_compat_api_key: ""
  agents_embedding_provider: "ollama"

schema:
  secret_key: str
  frontend_url: str
  debug: bool
  db_password: str
  pluggy_client_id: str
  pluggy_client_secret: str
